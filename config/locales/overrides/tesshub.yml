en:
  home:
    search_placeholder: >
      Search across %{site_name}...
    welcome: |
      <span class="text-primary">%{site_name}</span> - Gateway to training
    subtitle: "TeSSHub is a hub of community-managed training catalogues. Discover training relevant to you."
    catalogue:
      title: ""
      link_text: Start browsing
      events: "See the upcoming training events from all the %{site_name} communities."
      materials: "Browse the aggregated catalogue of training materials from across %{site_name}."
      workflows: "Create training workflows to visualise learning steps and link to resources specific to your training needs."
      providers: "Browse training providers to discover training resources they offer and follow links to their materials and courses."
      trainers: "Browse a directory of trainers based on their skills and expertise."
      spaces: "Browse a directory of community-managed spaces across different disciplines and themes."
      learning_paths: "Follow organized pathways of training resources leading you towards specific learning objectives."
      events_count: "%{total_events} upcoming events, %{last_month_events} added last month"
    faq:
      title: Frequently asked questions
      hub:
        q: What is %{site_name}?
        a: >
          <p>%{site_name} is a hub of training catalogues, or "Spaces", each managed by their own community.
          %{site_name} acts as both a portal for discovering Spaces relevant to your areas of interest, 
          as well as an aggregated browsing and search interface, where content from all Spaces can be discovered.</p>
      spaces:
        q: What is a Space?
        a: >
          <p>Spaces are customizable, community-managed sub-portals within %{site_name}, each with their own catalogue of training content.</p>
      get_space:
        q: How can I create a Space for my community?
        a: >
          <p>See <a href="https://elixirtess.github.io/docs/spaces/instance-or-space/" target="_blank">here</a> 
          for information about whether a Space is the right choice for you, 
          and see <a href="https://docs.google.com/forms/d/e/1FAIpQLSeNPKIsL3Ot-a5XHMogeTIe3duft6bdK4Q-elFmgw26fT6GZQ/viewform" target="_blank">here</a>
          to request a new space.</p>
    promo:
      browse_space:
        title: "Browse community-managed spaces"
        description: "Discover curated catalogues of training from multiple scientific disciplines and communities."
      create_space:
        title: "Onboard your community"
        description: "Establish a new training catalogue to support your own community."
      search:
        title: "Cross-space search"
        description: "Search and browse across all TeSSHub spaces from a unified interface."
  about:
    sidebar:
      join_tesshub: Joining the hub
    headings:
      join_tesshub: Joining the hub
    join_tesshub:
      Interested in onboarding your community into %{site_name}? Fill out our registration form 
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSeNPKIsL3Ot-a5XHMogeTIe3duft6bdK4Q-elFmgw26fT6GZQ/viewform" target="_blank">here</a>. 
      More details to come.
    registry: >
      %{site_name} is a hub of training catalogues, open to researchers from any scientific discipline or research-adjacent community across the world.    
      %{site_name} provides both a focused view of training content relevant to specific communities, whilst also
      providing a general cross-community search interface for querying over the pooled collection of resources.
    mtessx: >
      %{site_name} was developed as part of the <a href='https://elixirtess.github.io/mTeSS-X' target='_blank'>mTeSS-X Project</a> 
      (Multi-space Training e-Support System with eXchange), which aims to overcome the fragmentation of training 
      resources across Research Infrastructures and the European Science Clusters.
    history: >
      %{site_name} is based on the <a href='https://github.com/ElixirTeSS/TeSS' target='_blank'>TeSS platform</a>, 
      originally developed as part of <a href='https://elixir-europe.org/' target='_blank'>ELIXIR</a>,
      Europe's distributed infrastructure for life-science data.
